<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT APLIKATION</title>

  <!-- Favicon PNG -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KXfiZH8rPTGXUO9WWGEib8WmgQsAZS6-">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100dvh;
      border: none;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const base = "https://script.google.com/macros/s/AKfycbzLhMIfUBWPbJdG6sCQ6Xp47OuUPmWBfoW1x3RW1f6PjbxMsZ7zRxeEyoE4ppEIJJAm/exec";

      const isAdmin = location.search.includes("admin");

      document.getElementById("app").src = isAdmin ? base + "?page=admin" : base;
    });

    // Menangkap sinyal "postMessage" dari dalam Google Apps Script (iframe)
    window.addEventListener("message", function(event) {
      if (event.data === 'go_admin') {
        // Jika menekan Login Admin, redirect URL Github ke ?admin
        window.location.href = "?admin";
      } else if (event.data === 'go_siswa') {
        // Jika menekan Kembali ke Siswa, redirect URL Github ke tanpa parameter / ?siswa
        window.location.href = "?siswa";
      }
    });
  </script>
</head>
<body>

<iframe
  id="app"
  allow="camera; microphone; geolocation; fullscreen">
</iframe>

</body>
</html>
